# Dataset configuration. Paths differ per machine: set `root` here or via env ADAPTIVEPARK_DATA_ROOT.
dataset:
  name: MetaPKLot
  root: null                 # e.g. /kaggle/input/<dataset-slug>
  subset_fraction: 0.1       # train split only (val/test always full). 0.1 = initial working model; 1.0 = full data.
  seed: 42
  sources: [PKLot, CNRPark-EXT]   # PLds has annotations but no images in the Kaggle mirror
  annotation_variant: original    # matches the images on disk (cropped = coordinates of ROI-cropped images)

split:
  group: site_day            # a (site, day) is never split across train/val/test; CNR cameras share days
  ratios: [0.7, 0.15, 0.15]  # train, val, test by days per site
  seed: 42
  min_days_for_coverage: 3   # climates seen on >= 3 days of a site must appear in that site's val and test
  holdout_cameras: []        # optional camera-held-out test, e.g. ["CNRPark-EXT/camera9"] (removed from training)
  flagged_days: keep         # non-working / non-representative days are kept and tagged in day_flag

export:
  roi_mask: true             # gray out pixels outside annotationsRectangle (unlabelled region)
  workers: 8

audit:
  smoke_max_files: 200       # evenly spaced sample used in smoke mode
  compute_hashes: true       # sha256 per file (needed for exact-duplicate detection)
  near_duplicate:
    enabled: true
    hash_size: 8             # average-hash grid (8x8 = 64 bits)
    max_hamming: 2           # <= this many differing bits counts as near-duplicate
  tree_depth: 3
  annotation_exts: [".json", ".xml", ".txt", ".csv", ".yaml", ".yml", ".mat", ".npy", ".pkl"]
  image_exts: [".jpg", ".jpeg", ".png", ".bmp", ".tif", ".tiff", ".webp"]
  video_exts: [".mp4", ".avi", ".mov", ".mkv"]
